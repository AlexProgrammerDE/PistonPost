name: Deploy production

# Production deploys only run after CI succeeds for a push to main. The
# workflow_run event fires on every CI completion, so the job condition checks
# the conclusion, event, branch, and repository before deploying the exact
# commit CI tested. Manual runs are limited to main and still require a
# successful CI run for the selected commit.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only trusted pushes to main deploy, see above
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production after the cutover checklist is approved
        required: true
        type: string

permissions: {}

concurrency:
  group: pistonpost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'deploy-production')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_WORKER: pistonpost-production
    steps:
      - name: Require successful CI for the deployed commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$DEPLOY_SHA" --status success --json databaseId --jq 'length')"
          if [ "$runs" -lt 1 ]; then
            echo "CI has not succeeded for $DEPLOY_SHA on main. Wait for CI or fix it before deploying."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Load production configuration
        run: | # zizmor: ignore[github-env] the file is committed config from a trusted push to main
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .env.production >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gate
        run: bun run generated:check && bun run ci

      - name: Build production Worker
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          test -n "$POSTHOG_PERSONAL_API_KEY" || { echo "Missing POSTHOG_PERSONAL_API_KEY in the production environment"; exit 1; }
          bun run build:production

      - name: Verify production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun cf deploy --prebuilt --mode prod --dry-run

      - name: Confirm existing production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun cf d1 get "$PRODUCTION_D1_DATABASE_ID"

      - name: Record current production Worker version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          deployments="$(bun cf workers deployments list --worker "$PRODUCTION_WORKER")"
          version="$(jq -r '
            (if type == "array" then . else (.deployments // .result.deployments // []) end)
            | (.[0].versions // [])
            | max_by(.percentage // 0)
            | .version_id // empty
          ' <<<"$deployments")"
          if [ -z "$version" ]; then
            echo "No current production Worker version found."
            echo "version=none" >> "$GITHUB_OUTPUT"
            echo "commit=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit="$(bun cf workers versions get "$version" --worker-id "$PRODUCTION_WORKER" \
            | jq -r '(.annotations // .result.annotations // {})["workers/tag"] // "unknown"')" || commit="unknown"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Previous production Worker version: $version (commit $commit)"
          echo "Previous production Worker version: $version (commit $commit)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record D1 Time Travel bookmark
        id: bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bookmark="$(bun cf d1 time-travel get-bookmark "$PRODUCTION_D1_DATABASE_ID" | jq -r 'if type == "array" then .[0].bookmark else .bookmark end')"
          if [ -z "$bookmark" ] || [ "$bookmark" = "null" ]; then
            echo "Could not record a D1 Time Travel bookmark. Stopping before migrations."
            exit 1
          fi
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          echo "D1 bookmark before migration: $bookmark"
          echo "D1 bookmark before migration: $bookmark" >> "$GITHUB_STEP_SUMMARY"

      - name: List unapplied migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun cf d1 migrations list "$PRODUCTION_D1_DATABASE_ID" --dir drizzle

      - name: Apply generated migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun cf d1 migrations apply "$PRODUCTION_D1_DATABASE_ID" --dir drizzle

      - name: Deploy tagged Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          subject="$(git log -1 --pretty=%s "$DEPLOY_SHA")"
          bun cf deploy --prebuilt --mode prod --tag "$DEPLOY_SHA" --message "$subject"

      - name: Run production smoke tests
        run: bun run smoke:production

      - name: Publish rollback checkpoint
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          D1_BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          {
            echo "### Rollback checkpoint"
            echo
            echo "- Deploy status: $JOB_STATUS"
            echo "- Attempted commit: $DEPLOY_SHA"
            echo "- Previous Worker version: ${PREVIOUS_VERSION:-not recorded}"
            echo "- Previous Worker commit: ${PREVIOUS_COMMIT:-not recorded}"
            echo "- D1 bookmark before migration: ${D1_BOOKMARK:-not recorded}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
