name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production after the cutover checklist is approved
        required: true
        type: string

concurrency:
  group: pistonpost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load production configuration
        run: sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .env.production >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gate
        run: bun run generated:check && bun run ci

      - name: Build production Worker
        run: bun run build:production

      - name: Verify production deployment
        run: >-
          bun cf deploy --prebuilt --mode prod --dry-run

      - name: Confirm existing production database
        run: bun cf d1 get "$PRODUCTION_D1_DATABASE_ID"

      - name: Record D1 Time Travel bookmark
        id: bookmark
        run: |
          bookmark="$(bun cf d1 time-travel get-bookmark "$PRODUCTION_D1_DATABASE_ID" | jq -r 'if type == "array" then .[0].bookmark else .bookmark end')"
          test -n "$bookmark"
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          echo "D1 bookmark recorded before migration." >> "$GITHUB_STEP_SUMMARY"

      - name: List unapplied migrations
        run: bun cf d1 migrations list "$PRODUCTION_D1_DATABASE_ID" --dir drizzle

      - name: Apply generated migrations
        run: bun cf d1 migrations apply "$PRODUCTION_D1_DATABASE_ID" --dir drizzle

      - name: Deploy tagged Worker version
        run: |
          subject="$(git log -1 --pretty=%s)"
          bun cf deploy --prebuilt --mode prod --tag "$GITHUB_SHA" --message "$subject"

      - name: Run production smoke tests
        run: bun run smoke:production

      - name: Publish rollback checkpoint
        run: |
          echo "Rollback Worker commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback D1 bookmark: ${{ steps.bookmark.outputs.bookmark }}" >> "$GITHUB_STEP_SUMMARY"
