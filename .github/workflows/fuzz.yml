name: Fuzz

# Pull requests and pushes that touch the image sanitizer run each target for one minute.
# The weekly run fuzzes each target for ten minutes and keeps its corpus in the Actions cache.
on:
  pull_request:
    paths:
      - "wasm/image-sanitizer/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "wasm/image-sanitizer/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [sanitize_jpeg, sanitize_png, sanitize_gif, sanitize_webp]
    env:
      LONG_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      TARGET: ${{ matrix.target }}
      # The prebuilt cargo-fuzz is a static musl binary and defaults to its own target,
      # which AddressSanitizer does not support.
      TRIPLE: x86_64-unknown-linux-gnu
    defaults:
      run:
        working-directory: wasm/image-sanitizer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-11-01 --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore fuzz corpus
        if: env.LONG_RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasm/image-sanitizer/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build fuzz targets
        run: cargo +nightly-2026-11-01 fuzz build --target "$TRIPLE"

      # Under AddressSanitizer, a JPEG at the 2 megapixel limit takes about 2.5 seconds. A GIF at the
      # 50 megapixel animation limit takes about 11 seconds, so the GIF target gets a longer timeout.
      - name: Run fuzz target
        run: |
          if [ "$LONG_RUN" = true ]; then seconds=600; else seconds=60; fi
          if [ "$TARGET" = sanitize_gif ]; then timeout=30; else timeout=10; fi
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly-2026-11-01 fuzz run --target "$TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$seconds" -rss_limit_mb=2048 -timeout="$timeout"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: wasm/image-sanitizer/fuzz/artifacts
          if-no-files-found: ignore
