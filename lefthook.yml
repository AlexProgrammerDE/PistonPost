pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,json,jsonc,md,mdx,mjs,cjs,js,jsx,ts,tsx,toml,yaml,yml}"
      run: bunx oxfmt --check {staged_files}
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      exclude: "*.d.ts"
      run: bunx oxlint --no-error-on-unmatched-pattern {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    rustfmt:
      glob: &rust_files
        - "wasm/image-sanitizer/**/*.rs"
        - "wasm/image-sanitizer/{Cargo.toml,Cargo.lock,clippy.toml,rust-toolchain,rust-toolchain.toml}"
        - "{rust-toolchain,rust-toolchain.toml}"
      # The fuzz crate is its own workspace, so the sanitizer manifest does not cover it.
      run: >-
        RUSTUP_TOOLCHAIN=stable cargo fmt --manifest-path wasm/image-sanitizer/Cargo.toml --check &&
        RUSTUP_TOOLCHAIN=stable cargo fmt --manifest-path wasm/image-sanitizer/fuzz/Cargo.toml --check

pre-push:
  commands:
    clippy:
      glob: *rust_files
      run: RUSTUP_TOOLCHAIN=stable cargo clippy --manifest-path wasm/image-sanitizer/Cargo.toml --all-targets --locked -- -D warnings
    cargo-deny:
      glob:
        - "wasm/image-sanitizer/{Cargo.toml,Cargo.lock}"
        - "deny.toml"
      run: RUSTUP_TOOLCHAIN=stable cargo deny --locked --manifest-path wasm/image-sanitizer/Cargo.toml --config deny.toml check

commit-msg:
  commands:
    conventional:
      run: |
        message=$(head -n 1 "{1}")
        if ! printf '%s\n' "$message" | grep -qE '^(Merge |Revert "|fixup! |squash! |amend! |(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+)'; then
          echo "Use a Conventional Commit message, for example: fix(parser): handle empty input"
          exit 1
        fi
