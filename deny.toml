[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["0BSD", "Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
